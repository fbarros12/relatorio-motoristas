<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Finalizar Turno</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">
    <div class="card shadow-sm border-0 rounded-4 mx-auto" style="max-width: 480px;">
        <div class="card-body p-4">

            <h3 class="text-center mb-4">Finalizar Turno</h3>

            <form action="/finalizar-turno" method="post">

                <input type="hidden" name="usuario" value="{{ usuario }}">
                <input type="hidden" name="veiculo" value="{{ veiculo }}">
                <input type="hidden" name="turno" value="{{ turno }}">

                <div class="mb-3">
                    <label class="form-label">Motorista</label>
                    <input type="text" class="form-control" value="{{ usuario }}" readonly>
                </div>

                <div class="mb-3">
                    <label class="form-label">Veículo</label>
                    <input type="text" class="form-control" value="{{ veiculo }}" readonly>
                </div>

                <div class="mb-3">
                    <label class="form-label">Turno</label>
                    <input type="text" class="form-control" value="{{ turno }}" readonly>
                </div>

                <div class="mb-3">
                    <label class="form-label">Hodômetro final</label>
                    <input type="number" step="0.1" name="hodometro_final" class="form-control" required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Observações</label>
                    <textarea name="observacoes" class="form-control" rows="3"></textarea>
                </div>

                <button type="submit" class="btn btn-danger w-100 mb-2">
                    Finalizar Turno
                </button>
            </form>

            <button class="btn btn-secondary w-100" onclick="location.href='/menu?usuario={{ usuario }}'">
                Voltar
            </button>

        </div>
    </div>
</div>

</body>
</html>
