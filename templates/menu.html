<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Menu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<!-- Mensagem exibida depois de validacoes ou conclusao de acoes. -->
{% if mensagem %}
<div class="alert alert-warning text-center">
    {{ mensagem }}
</div>
{% endif %}

<body class="bg-light">

<!-- Menu central com os principais fluxos do motorista. -->
<div class="container py-5">
    <div class="card shadow-sm border-0 rounded-4 mx-auto" style="max-width: 420px;">
        <div class="card-body p-4">

            <h3 class="text-center mb-4">Menu Principal</h3>
            <p class="text-center text-muted mb-3">
                Motorista: <strong>{{ usuario }}</strong>
            </p>

            <!-- Botoes de navegacao para cada formulario e historico. -->
            <div class="d-grid gap-3">
                 <button class="btn btn-success btn-lg" onclick="location.href='/abertura-turno?usuario={{ usuario }}'">
                    Abertura de Turno
                </button>

                <button class="btn btn-primary btn-lg" onclick="location.href='/inspecao?usuario={{ usuario }}'">
                    Inspeção
                </button>

                <button class="btn btn-outline-primary btn-lg" onclick="location.href='/abastecimento?usuario={{ usuario }}'">
                    Abastecimento
                </button>

                <button class="btn btn-outline-primary btn-lg" onclick="location.href='/downtime'">
                    Downtime
                </button>

                <button class="btn btn-outline-dark btn-lg" onclick="location.href='/historico'">
                    Histórico
                </button>

                <button class="btn btn-outline-dark btn-lg" onclick="location.href='/historico-turnos'">
                    Histórico de Turnos
                </button>

                <button class="btn btn-outline-dark btn-lg" onclick="location.href='/historico-abastecimentos?usuario={{ usuario }}'">
                    Histórico de Abastecimentos
                </button>

                <button class="btn btn-danger btn-lg" onclick="location.href='/finalizar-turno?usuario={{ usuario }}'">
                    Finalizar Turno
                </button>

                <button class="btn btn-secondary btn-lg" onclick="location.href='/'">
                    Sair
                </button>
            </div>

        </div>
    </div>
</div>

</body>
</html>
