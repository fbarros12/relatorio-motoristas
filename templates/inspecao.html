<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Inspeção</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- Formulario de inspecao vinculado ao turno ativo do motorista. -->
<div class="container py-4">
    <div class="card shadow-sm border-0 rounded-4 mx-auto" style="max-width: 480px;">
        <div class="card-body p-4">

            <h3 class="text-center mb-4">Inspeção</h3>

            <!-- Envia os itens de seguranca para salvar no SQLite e InfluxDB. -->
            <form action="/inspecao" method="post">
                <!-- Usuario fica oculto para manter o vinculo com o motorista logado. -->
                <input type="hidden" name="usuario" value="{{ usuario }}">

                <div class="mb-3">
                    <label class="form-label">Veículo</label>
                    <input type="text" name="veiculo" class="form-control" value="{{ veiculo }}" readonly>
                </div> 

                <div class="mb-3">
                    <label class="form-label">Faróis</label>
                    <select name="farois" class="form-select" required>
                        <option value="" disabled selected>Selecione</option>
                        <option value="OK">OK</option>
                        <option value="NOK">NOK</option>
                        <option value="N/A">N/A</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Lanternas</label>
                    <select name="lanternas" class="form-select" required>
                        <option value="" disabled selected>Selecione</option>
                        <option value="OK">OK</option>
                        <option value="NOK">NOK</option>
                        <option value="N/A">N/A</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Pneus</label>
                    <select name="pneus" class="form-select" required>
                        <option value="" disabled selected>Selecione</option>
                        <option value="OK">OK</option>
                        <option value="NOK">NOK</option>
                        <option value="NA">N/A</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label">Observações</label>
                    <textarea name="observacoes" class="form-control" rows="3"></textarea>
                </div>

                <button type="submit" class="btn btn-primary w-100 mb-2">
                    Salvar
                </button>

            </form>

            <button class="btn btn-secondary w-100" onclick="location.href='/menu?usuario={{ usuario }}'">
                Voltar
            </button>

        </div>
    </div>
</div>

</body>
</html>
