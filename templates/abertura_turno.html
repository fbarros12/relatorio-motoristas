<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Abertura de Turno</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- Formulario usado para iniciar um turno de trabalho. -->
<div class="container py-4">
    <div class="card shadow-sm border-0 rounded-4 mx-auto" style="max-width: 480px;">
        <div class="card-body p-4">

            <h3 class="text-center mb-4">Abertura de Turno</h3>

            <!-- Envia veiculo, hodometro inicial e turno para o banco local. -->
            <form action="/abertura-turno" method="post">

                <!-- Usuario oculto associa a abertura ao motorista atual. -->
                <input type="hidden" name="usuario" value="{{ usuario }}">

                <div class="mb-3">
                    <label class="form-label">Motorista</label>
                    <input type="text" class="form-control" value="{{ usuario }}" disabled>
                </div>

                <div class="mb-3">
                    <label class="form-label">Veículo</label>
                    <input type="text" name="veiculo" class="form-control" placeholder="Ex: RT001 ou placa" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Hodômetro inicial</label>
                    <input type="number" name="hodometro_inicial" class="form-control" placeholder="Ex: 12500" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Turno</label>
                    <select name="turno" class="form-select" required>
                        <option value="" disabled selected>Selecione</option>
                        <option value="Primeiro turno">Primeiro turno</option>
                        <option value="Segundo turno">Segundo turno</option>
                        <option value="Terceiro turno">Terceiro turno</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label">Observações</label>
                    <textarea name="observacoes" class="form-control" rows="3"></textarea>
                </div>

                <button type="submit" class="btn btn-primary w-100 mb-2">Salvar</button>
            </form>

            <button class="btn btn-secondary w-100" onclick="location.href='/menu?usuario={{ usuario }}'">
                Voltar
            </button>

        </div>
    </div>
</div>

</body>
</html>
