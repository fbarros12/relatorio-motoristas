<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Downtime</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">
    <div class="card shadow-sm border-0 rounded-4 mx-auto" style="max-width: 500px;">
        <div class="card-body p-4">

            <h3 class="text-center mb-4">
                Registro de Downtime
            </h3>

            {% if mensagem %}
            <div class="alert alert-warning text-center">
                {{ mensagem }}
            </div>
            {% endif %}

            <form action="/downtime" method="post">

                <input type="hidden" name="usuario" value="{{ usuario }}">
                <input type="hidden" name="veiculo" value="{{ veiculo }}">
                <input type="hidden" name="turno" value="{{ turno }}">

                <div class="mb-3">
                    <label class="form-label">Motorista</label>
                    <input type="text" class="form-control" value="{{ usuario }}" readonly>
                </div>

                <div class="mb-3">
                    <label class="form-label">Veículo</label>
                    <input type="text" class="form-control" value="{{ veiculo }}" readonly>
                </div>

                <div class="mb-3">
                    <label class="form-label">Turno</label>
                    <input type="text" class="form-control" value="{{ turno }}" readonly>
                </div>

                <div class="mb-3">
                    <label class="form-label">Categoria</label>

                    <select name="categoria" class="form-select" required>
                        <option value="" disabled selected>Selecione</option>

                        <option value="Manutenção">Manutenção</option>
                        <option value="Abastecimento">Abastecimento</option>
                        <option value="Aguardando Peça">Aguardando Peça</option>
                        <option value="Aguardando Orientação">Aguardando Orientação</option>
                        <option value="Problema no Veículo">Problema no Veículo</option>
                        <option value="Problema de Pista">Problema de Pista</option>
                        <option value="Clima">Clima</option>
                        <option value="Outro">Outro</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Hora Inicial</label>
                    <input type="datetime-local"
                           name="hora_inicio"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Hora Final</label>
                    <input type="datetime-local"
                           name="hora_fim"
                           class="form-control"
                           required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Observações</label>

                    <textarea
                        name="observacoes"
                        class="form-control"
                        rows="3"></textarea>
                </div>

                <button type="submit"
                        class="btn btn-warning w-100 mb-2">
                    Salvar Downtime
                </button>

            </form>

            <button
                class="btn btn-secondary w-100"
                onclick="location.href='/menu?usuario={{ usuario }}'">
                Voltar
            </button>

        </div>
    </div>
</div>

</body>
</html>
