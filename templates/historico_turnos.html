<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Histórico de Turnos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">
    <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body">

            <h3 class="text-center mb-4">Histórico de Turnos</h3>

            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Data</th>
                            <th>Motorista</th>
                            <th>Veículo</th>
                            <th>Turno</th>
                            <th>KM Rodado</th>
                        </tr>
                    </thead>

                    <tbody>
                        {% for item in dados %}
                        <tr>
                            <td>{{ item[0] }}</td>
                            <td>{{ item[1] }}</td>
                            <td>{{ item[2] }}</td>
                            <td>{{ item[3] }}</td>
                            <td>
                                <span class="badge bg-primary">
                                    {{ "%.1f"|format(item[4]) }} km
                                </span>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>

            <button class="btn btn-secondary w-100 mt-3" onclick="location.href='/menu'">
                Voltar
            </button>

        </div>
    </div>
</div>

</body>
</html>
